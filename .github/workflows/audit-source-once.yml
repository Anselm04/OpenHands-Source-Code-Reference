name: One-time exact Git tree source audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .trillionai
            docs
            TRILLIONAI_REFERENCE.md
      - name: Compare original pinned Git object identities
        shell: bash
        env:
          UPSTREAM_SHA: 46f20abafecbd03c422213bff4bc4499607b9b4f
          UPSTREAM_URL: https://github.com/OpenHands/OpenHands.git
        run: |
          set -euo pipefail
          git init -q /tmp/audit-upstream
          git -C /tmp/audit-upstream remote add origin "$UPSTREAM_URL"
          git -C /tmp/audit-upstream -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin "$UPSTREAM_SHA"
          test "$(git -C /tmp/audit-upstream rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          python3 - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          def tree(d,ref):
              raw=subprocess.check_output(["git","-C",d,"ls-tree","-rz",ref])
              result={}
              for e in raw.split(b"\0"):
                  if not e: continue
                  head,path=e.split(b"\t",1)
                  mode,kind,oid=head.decode().split()
                  result[path.decode("utf-8","surrogateescape")]={"mode":mode,"type":kind,"sha":oid}
              return result
          up=tree("/tmp/audit-upstream","FETCH_HEAD")
          dest=tree(".","HEAD")
          missing=sorted(set(up)-set(dest))
          mismatches=sorted(p for p in set(up)&set(dest) if up[p]!=dest[p])
          extra=sorted(set(dest)-set(up))
          ci=[p for p in missing if p.startswith(".github/workflows/")]
          doc={"upstream":os.environ["UPSTREAM_URL"],"upstream_commit":os.environ["UPSTREAM_SHA"],"audited_main_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"upstream_git_entries":len(up),"main_git_entries":len(dest),"missing_count":len(missing),"excluded_ci_paths_count":len(ci),"other_missing_count":len(missing)-len(ci),"object_or_mode_mismatch_count":len(mismatches),"extra_count":len(extra),"missing_paths":missing,"mismatches":[{"path":p,"original":up[p],"main":dest[p]} for p in mismatches],"extra_paths":extra}
          out=Path("docs/verified-source-audit");out.mkdir(parents=True,exist_ok=True)
          (out/"openhands-main-delta.json").write_text(json.dumps(doc,indent=2)+"\n")
          (out/"openhands-summary.md").write_text("# openhands: pinned upstream versus main\n\n- Pinned upstream revision: `"+os.environ["UPSTREAM_SHA"]+"`\n- Upstream Git entries: **"+str(len(up))+"**\n- Current main Git entries: **"+str(len(dest))+"**\n- Missing tracked paths: **"+str(len(missing))+"** (upstream CI workflows: **"+str(len(ci))+"**; other: **"+str(len(missing)-len(ci))+"**)\n- File SHA/mode mismatches: **"+str(len(mismatches))+"**\n- Extra reference-repository entries: **"+str(len(extra))+"**\n\nSee JSON for every differing path, hash and mode. The source was not executed. Excludes external submodule payloads, downloaded LFS binaries, private services and full history.\n")
          print(json.dumps({k:v for k,v in doc.items() if not isinstance(v,list)},indent=2))
          PY
          rm .github/workflows/audit-source-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'audit: compare pinned upstream object identities against main'
          git push origin HEAD:main
